<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panela-Velha | Receitas do Mundo</title>
  
  <!-- Fontes do Google para cada cultura -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Noto+Sans+JP:wght@700&family=Playfair+Display:ital,wght@1,700&family=Poppins:wght@600&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Banner com imagem de fundo de cozinha -->
  <header class="header">
    <div class="header-overlay">
      <div class="logo">
        <h1>🥘 Panela-Velha</h1>
        <p>Sabores e culturas ao seu alcance</p>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Barra de Filtros com elementos arredondados -->
    <section class="filters">
      <div class="filter-group">
        <label for="tipo">Tipo:</label>
        <select id="tipo">
          <option value="todos">Todos</option>
          <option value="salgado">Salgado</option>
          <option value="doce">Doce</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="cultura">Cultura:</label>
        <select id="cultura">
          <option value="todas">Todas</option>
          <option value="italiana">Italiana</option>
          <option value="japonesa">Japonesa</option>
          <option value="mexicana">Mexicana</option>
          <option value="brasileira">Brasileira</option>
        </select>
      </div>
    </section>

    <!-- Lista de Receitas -->
    <section class="recipe-grid" id="recipeGrid">
      <!-- Cards gerados via JS -->
    </section>
  </main>

  <!-- Modal/Tela de Detalhes da Receita -->
  <div class="modal" id="recipeModal">
    <div class="modal-content">
      <span class="close-btn" id="closeBtn">&times;</span>
      <h2 id="modalTitle"></h2>
      <div class="tags" id="modalTags"></div>
      
      <div class="video-container">
        <iframe id="modalVideo" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>

      <div class="recipe-text">
        <h3>Ingredientes</h3>
        <ul id="modalIngredients"></ul>

        <h3>Modo de Preparo</h3>
        <ol id="modalInstructions"></ol>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
